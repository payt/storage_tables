plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-rails
  - rubocop-performance
  - rubocop-packaging

AllCops:
  TargetRubyVersion: 3.4
  TargetRailsVersion: 8.2
  NewCops: enable
  Exclude:
    - db/**/*
    - bin/**/*
    - vendor/**/*
    - test/dummy/**/*

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Layout/EndAlignment:
  EnforcedStyleAlignWith: start_of_line

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

# The test dummy models are fixtures for the test suite, not autoloaded production constants.
Style/OneClassPerFile:
  Exclude:
    - test/**/*

########### METRICS ###############

Metrics/AbcSize:
  Max: 50

Metrics/ClassLength:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - test/**/*

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/MethodLength:
  CountAsOne:
    - array
    - hash
    - heredoc
  Max: 30

## MINITEST
Minitest/MultipleAssertions:
  Max: 5

## RAILS

Rails/InverseOf:
  Enabled: true
  Exclude:
    - app/models/storage_tables/attachment.rb

Rails/DynamicFindBy:
  Enabled: true
  Whitelist:
    - find_by_checksum
    - find_by_checksum!

# The test suite bootstrap warns the developer on stdout, the Rails logger is not set up there.
Rails/Output:
  Exclude:
    - test/**/*
